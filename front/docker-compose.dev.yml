services:
  roomly_frontend:
    build: .
    env_file:
      - .env
      - .env.prod
    container_name: client
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - '3030:3030'
    networks: [roomly_network]

networks:
  roomly_network:
    external: true
