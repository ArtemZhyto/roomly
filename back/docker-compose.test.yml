services:
  roomly_test_postgres:
    image: postgres:17-alpine
    container_name: roomly_test_postgres
    environment:
      POSTGRES_USER: bookingUser
      POSTGRES_PASSWORD: bookingPassword
      POSTGRES_DB: roomly_test
    ports:
      - '5002:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - roomly_test_postgres_data:/var/lib/postgresql/data

volumes:
  roomly_test_postgres_data:
